[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-change-intelligence"
version = "0.1.0"
description = "Pre-release blast-radius forecasting and release gates for AI/ML/LLM systems"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "Badhusha K"}]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
aici = "aici.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
